// Historial: se guardan hasta 12 semanas (base para métricas y patrones futuros), pero en "Recientes" se muestran solo las 4 últimas.
const HIST_MAX_GUARDADAS=12;
const HIST_MAX_VISIBLES=4;
const LS_LISTAS_GUARDADAS='menutwist_listas_guardadas';

function getSemanaId(){
  const d=new Date(), j=new Date(d.getFullYear(),0,1);
  return d.getFullYear()+'-W'+Math.ceil(((d-j)/86400000+j.getDay()+1)/7);
}

function lunesDeFecha(d){
  const dow=(d.getDay()+6)%7;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow);
}
function idFecha(d){
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function getLunesActualId(){ return idFecha(lunesDeFecha(new Date())); }

function formatRangoDeSemana(lunes){
  const domingo=new Date(lunes);domingo.setDate(lunes.getDate()+6);
  const mismoMes=lunes.getMonth()===domingo.getMonth();
  // El número grande de la tarjeta queda siempre corto (solo días) para que no se amontone
  // cuando la semana cruza de mes — esa info va en el subtítulo chico de abajo (mes) en su lugar.
  const rango=`${lunes.getDate()}–${domingo.getDate()}`;
  const mes=mismoMes
    ? capFirst(MESES[domingo.getMonth()]).slice(0,3)
    : `${capFirst(MESES[lunes.getMonth()]).slice(0,3)}–${capFirst(MESES[domingo.getMonth()]).slice(0,3)}`;
  const nombre=mismoMes
    ? `Semana del ${lunes.getDate()} al ${domingo.getDate()} de ${capFirst(MESES[domingo.getMonth()])}`
    : `Semana del ${lunes.getDate()} de ${capFirst(MESES[lunes.getMonth()])} al ${domingo.getDate()} de ${capFirst(MESES[domingo.getMonth()])}`;
  return {rango,mes,nombre};
}
function numeroSemana(lunes){
  const j=new Date(lunes.getFullYear(),0,1);
  return Math.ceil(((lunes-j)/86400000+j.getDay()+1)/7);
}

function archivarSemanaActual(lunesId, menuFuente){
  const src=menuFuente||menu;
  if(!src)return null;
  const tieneContenido=[...DIAS_SEM,...DIAS_FIN].some(d=>src[d]&&(src[d].m||src[d].n||(src[d].notas&&src[d].notas.trim())));
  if(!tieneContenido)return null;
  const lunes=new Date(lunesId+'T00:00:00');
  const {rango,mes,nombre}=formatRangoDeSemana(lunes);
  const semana=numeroSemana(lunes);
  const menuArchivado={};
  [...DIAS_SEM,...DIAS_FIN].forEach(d=>{
    const dd=src[d]||{};
    menuArchivado[d]={m:dd.m||null,n:dd.n||null,gm:dd.gm||'',gn:dd.gn||'',notas:dd.notas||''};
  });
  const entry={id:'w'+lunesId,nombre,rango,mes,semana,menu:menuArchivado};
  const realesPrevias=HISTORIAL_SEMANAS.filter(h=>h.id&&h.id.startsWith('w')&&h.id!==entry.id);
  HISTORIAL_SEMANAS=[entry,...realesPrevias].slice(0,HIST_MAX_GUARDADAS);
  try{localStorage.setItem(LS_HISTORIAL, JSON.stringify(HISTORIAL_SEMANAS));}catch(e){}
  return entry;
}

function sincronizarEstadoBiblioteca(){
  const baseIds=new Set(BIBLIOTECA_BASE.map(c=>c.id));
  const currentIds=new Set(biblioteca.map(c=>c.id));
  bibliotecaEliminados=BIBLIOTECA_BASE.map(c=>c.id).filter(id=>!currentIds.has(id));
  const overrides={};
  biblioteca.forEach(c=>{
    if(!baseIds.has(c.id))return;
    const baseItem=BIBLIOTECA_BASE.find(b=>b.id===c.id);
    const diff={};
    Object.keys(c).forEach(k=>{
      if(JSON.stringify(c[k])!==JSON.stringify(baseItem[k]))diff[k]=c[k];
    });
    if(Object.keys(diff).length)overrides[c.id]=diff;
  });
  // v132: los platos retirados conservan los cambios que la usuaria les haya hecho (favorito, freezer, etc.)
  bibliotecaRetirados.forEach(c=>{
    const baseItem=BIBLIOTECA_RETIRADOS.find(b=>b.id===c.id);if(!baseItem)return;
    const diff={};
    Object.keys(c).forEach(k=>{if(JSON.stringify(c[k])!==JSON.stringify(baseItem[k]))diff[k]=c[k];});
    if(Object.keys(diff).length)overrides[c.id]=diff;
  });
  bibliotecaOverrides=overrides;
  bibliotecaManual=biblioteca.filter(c=>!baseIds.has(c.id));
}

function ingsParaGuardar(){
  const out={};
  Object.keys(INGS).forEach(k=>{
    if(INGS_BASE&&INGS_BASE[k]&&JSON.stringify(INGS_BASE[k])===JSON.stringify(INGS[k]))return;
    out[k]=INGS[k];
  });
  return out;
}
function guardar(){
  try{
    sincronizarEstadoBiblioteca();
    localStorage.setItem(LS_MENU, JSON.stringify(menu));
    localStorage.setItem(LS_STOCK,JSON.stringify(stockTachado));
    localStorage.setItem(LS_STOCK_EXCL,JSON.stringify(stockExcluidos));
    localStorage.setItem(LS_STOCK_EXTRA,JSON.stringify(stockExtra));
    localStorage.setItem(LS_STOCK_QTY,JSON.stringify(stockCantidades));
    localStorage.setItem(LS_FINDE,JSON.stringify(findeMostrado));
    localStorage.setItem(LS_WEEK, getSemanaId());
    localStorage.setItem(LS_BIB_OVERRIDES, JSON.stringify(bibliotecaOverrides));
    localStorage.setItem(LS_BIB_ELIMINADOS, JSON.stringify(bibliotecaEliminados));
    localStorage.setItem(LS_BIB_MANUAL, JSON.stringify(bibliotecaManual));
    localStorage.setItem(LS_ORIGEN, origenSemana||'');
    localStorage.setItem(LS_STARTED, weekStarted?'1':'0');
    localStorage.setItem(LS_SALSAS,  JSON.stringify(SALSAS));
    localStorage.setItem(LS_SALSAS_FREEZADAS, JSON.stringify(salsasFreezadas));
    localStorage.setItem(LS_GBANK_OFICIAL, JSON.stringify(GUARNICIONES_BANK));
    localStorage.setItem(LS_GBANK,   JSON.stringify(guarniBank));
    localStorage.setItem(LS_GUARNI_ELIM, JSON.stringify(guarniEliminadas));
    localStorage.setItem(LS_RESTR,   JSON.stringify(restriccionesActivas));
    localStorage.setItem(LS_REGLASLIBRES, JSON.stringify(reglasLibres));
    localStorage.setItem(LS_INGS, JSON.stringify(ingsParaGuardar()));
    localStorage.setItem(LS_INGS_V2,'1');
  }catch(e){}
}

function cargar(){
  if(!INGS_BASE)INGS_BASE=JSON.parse(JSON.stringify(INGS));
  let _archivadaAlAbrir=null;
  try{
    const histSaved=localStorage.getItem(LS_HISTORIAL);
    if(histSaved){
      const parsedHist=JSON.parse(histSaved);
      if(Array.isArray(parsedHist))HISTORIAL_SEMANAS=parsedHist.filter(h=>h&&h.id&&String(h.id).startsWith('w')).slice(0,HIST_MAX_GUARDADAS);
    }
    // Migración: semanas reales ya archivadas con el formato viejo de rango/mes (quedaba amontonado
    // al cruzar de mes, ej. "28/9–4/10") se recalculan con el formato corto nuevo ("28–4" + "Sep–Oct").
    let _histCorregido=false;
    HISTORIAL_SEMANAS=HISTORIAL_SEMANAS.map(h=>{
      if(!h.id||!h.id.startsWith('w'))return h;
      const lunes=new Date(h.id.slice(1)+'T00:00:00');
      if(isNaN(lunes.getTime()))return h;
      const fix=formatRangoDeSemana(lunes);
      if(h.rango!==fix.rango||h.mes!==fix.mes){_histCorregido=true;return{...h,...fix};}
      return h;
    });
    if(_histCorregido){try{localStorage.setItem(LS_HISTORIAL, JSON.stringify(HISTORIAL_SEMANAS));}catch(e){}}
    const listasSaved=localStorage.getItem(LS_LISTAS_GUARDADAS);
    if(listasSaved){
      const parsedListas=JSON.parse(listasSaved);
      if(Array.isArray(parsedListas))LISTAS_GUARDADAS=parsedListas; // v108: una lista vacía (todo borrado) se respeta
    }
    const lunesGuardado=localStorage.getItem(LS_SEMANA_LUNES);
    const lunesHoyId=getLunesActualId();
    if(lunesGuardado && lunesGuardado!==lunesHoyId){
      const mPrev=localStorage.getItem(LS_MENU);
      if(mPrev){ try{_archivadaAlAbrir=archivarSemanaActual(lunesGuardado, JSON.parse(mPrev));}catch(e){} }
      [...DIAS_SEM,...DIAS_FIN].forEach(d=>{menu[d]={m:null,n:null,gm:'',gn:'',notas:''}; });
      stockTachado={};
      weekStarted=false;origenSemana=null;
      localStorage.setItem(LS_SEMANA_LUNES, lunesHoyId);
      localStorage.setItem(LS_MENU, JSON.stringify(menu));
      localStorage.setItem(LS_STOCK, JSON.stringify(stockTachado));
      localStorage.setItem(LS_STARTED, '0');
      localStorage.setItem(LS_ORIGEN, '');
    } else {
      if(!lunesGuardado) localStorage.setItem(LS_SEMANA_LUNES, lunesHoyId);
      const m=localStorage.getItem(LS_MENU);   if(m) menu=JSON.parse(m);
      const s=localStorage.getItem(LS_STOCK);  if(s) stockTachado=JSON.parse(s);
      const sx=localStorage.getItem(LS_STOCK_EXCL); if(sx){const p=JSON.parse(sx);if(Array.isArray(p))stockExcluidos=p;}
      const se=localStorage.getItem(LS_STOCK_EXTRA); if(se){const p=JSON.parse(se);if(Array.isArray(p))stockExtra=p;}
      const sq=localStorage.getItem(LS_STOCK_QTY); if(sq){const p=JSON.parse(sq);if(p&&typeof p==='object')stockCantidades=p;}
      const f=localStorage.getItem(LS_FINDE);  if(f) findeMostrado=JSON.parse(f);
      const o=localStorage.getItem(LS_ORIGEN); if(o) origenSemana=o||null;
      const st=localStorage.getItem(LS_STARTED); weekStarted = st==='1';
    }
    const ov=localStorage.getItem(LS_BIB_OVERRIDES);
    if(ov){const parsed=JSON.parse(ov);if(parsed&&typeof parsed==='object')bibliotecaOverrides=parsed;}
    migrarAceptacionPersonal();
    const eli=localStorage.getItem(LS_BIB_ELIMINADOS);
    if(eli){const parsed=JSON.parse(eli);if(Array.isArray(parsed))bibliotecaEliminados=parsed;}
    const man=localStorage.getItem(LS_BIB_MANUAL);
    if(man){const parsed=JSON.parse(man);if(Array.isArray(parsed))bibliotecaManual=parsed.map(c=>({favorito:false,oculto:false,...c}));}
    const sl=localStorage.getItem(LS_SALSAS);
    if(sl){const parsed=JSON.parse(sl);if(Array.isArray(parsed))SALSAS=[...new Set([...SALSAS,...parsed])];}
    const sfz=localStorage.getItem(LS_SALSAS_FREEZADAS);
    if(sfz){const parsed=JSON.parse(sfz);if(parsed&&typeof parsed==='object')salsasFreezadas=parsed;}
    const gbo=localStorage.getItem(LS_GBANK_OFICIAL);
    if(gbo){const parsed=JSON.parse(gbo);if(Array.isArray(parsed))GUARNICIONES_BANK=[...new Set([...GUARNICIONES_BANK,...parsed])];}
    const gb=localStorage.getItem(LS_GBANK);
    if(gb){const parsed=JSON.parse(gb);if(Array.isArray(parsed))guarniBank=parsed;}
    guarniBank=guarniBank.filter(g=>!SALSAS.includes(g));
    const gel=localStorage.getItem(LS_GUARNI_ELIM);
    if(gel){const parsed=JSON.parse(gel);if(Array.isArray(parsed))guarniEliminadas=parsed;}
    if(guarniEliminadas.length){
      GUARNICIONES_BANK=GUARNICIONES_BANK.filter(x=>!guarniEliminadas.includes(x));
      guarniBank=guarniBank.filter(x=>!guarniEliminadas.includes(x));
    }
    const rs=localStorage.getItem(LS_RESTR);
    if(rs){const parsed=JSON.parse(rs);if(Array.isArray(parsed))restriccionesActivas=parsed;}
    const rl=localStorage.getItem(LS_REGLASLIBRES);
    if(rl){const parsed=JSON.parse(rl);if(Array.isArray(parsed))reglasLibres=parsed;}
    const ei=localStorage.getItem(LS_INGS);
    if(ei){const parsed=JSON.parse(ei);if(parsed&&typeof parsed==='object'){
      const yaV2=localStorage.getItem(LS_INGS_V2)==='1';
      Object.keys(parsed).forEach(k=>{
        if(!Array.isArray(parsed[k]))return;
        if(!yaV2&&INGS_BASE[k]){
          // Guardado viejo (INGS completo): solo se respeta si la persona realmente lo editó.
          const v=JSON.stringify(parsed[k]);
          if(v===JSON.stringify(INGS_BASE[k]))return;
          if(INGS_LEGACY_89[k]&&v===JSON.stringify(INGS_LEGACY_89[k]))return;
        }
        INGS[k]=parsed[k];
      });
    }}
    const SALSA_RENOMBRE={'Salsa tuco':'Tuco casero','Salsa boloñesa':'Bolognesa','Salsa mixta':'Rosa'};
    const renSalsa=mm=>{if(!mm)return;Object.values(mm).forEach(dd=>{if(!dd)return;['gm','gn'].forEach(k=>{if(SALSA_RENOMBRE[dd[k]])dd[k]=SALSA_RENOMBRE[dd[k]];});});};
    renSalsa(menu);LISTAS_GUARDADAS.forEach(l=>renSalsa(l.menu));HISTORIAL_SEMANAS.forEach(h=>renSalsa(h.menu));
    const idsExPlato=new Set(['45','46','47','69','76','68','60','67']);
    [...DIAS_SEM,...DIAS_FIN].forEach(d=>{
      if(menu[d]){
        if(idsExPlato.has(menu[d].m)){menu[d].m=null;menu[d].gm='';}
        if(idsExPlato.has(menu[d].n)){menu[d].n=null;menu[d].gn='';}
      }
    });
  }catch(e){
  }
  construirBiblioteca();
  const allIds=[...BIBLIOTECA_BASE,...BIBLIOTECA_RETIRADOS,...bibliotecaManual].map(c=>parseInt(c.id)).filter(n=>!isNaN(n));
  if(allIds.length)nextId=Math.max(nextId,...allIds)+1;
  /* Recién acá la biblioteca ya está armada con sus overrides, así que el apagado
     automático de freezer de la semana que se acaba de archivar se hace al final. */
  if(_archivadaAlAbrir){apagarFreezerUsado(_archivadaAlAbrir.menu);apagarFreezerSalsaUsada(_archivadaAlAbrir.menu);}
}

const MT_BACKUP_KEYS=[
  LS_MENU,LS_BIB_OVERRIDES,LS_BIB_ELIMINADOS,LS_BIB_MANUAL,
  LS_STOCK,LS_STOCK_EXCL,LS_STOCK_EXTRA,LS_STOCK_QTY,
  LS_FINDE,LS_WEEK,LS_ORIGEN,LS_STARTED,
  LS_SALSAS,LS_SALSAS_FREEZADAS,LS_GBANK_OFICIAL,LS_GBANK,LS_GUARNI_ELIM,
  LS_RESTR,LS_REGLASLIBRES,LS_INGS,
  LS_SEMANA_LUNES,LS_HISTORIAL,LS_LISTAS_GUARDADAS
];
let backupPendiente=null;

function exportarBackup(){
  guardar();
  const datos={};
  MT_BACKUP_KEYS.forEach(k=>{
    const v=localStorage.getItem(k);
    if(v!==null)datos[k]=v;
  });
  const payload={app:'menutwist',formato:1,exportadoEl:new Date().toISOString(),datos};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`menutwist-backup-${mtFechaLocal()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Backup descargado');
  mtTrack('backup_exportado');
}

function importarBackup(e){
  const file=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let payload;
    try{ payload=JSON.parse(reader.result); }
    catch(err){ toast('Ese archivo no es un backup válido de MenuTwist'); return; }
    if(!payload||(payload.app!=='menutwist'&&payload.app!=='menufy')||!payload.datos||typeof payload.datos!=='object'){
      toast('Ese archivo no es un backup válido de MenuTwist');
      return;
    }
    backupPendiente=payload;
    confirmarRestaurarBackup();
  };
  reader.onerror=()=>toast('No se pudo leer el archivo');
  reader.readAsText(file);
}

function confirmarRestaurarBackup(){
  const fecha=backupPendiente?.exportadoEl ? new Date(backupPendiente.exportadoEl).toLocaleDateString('es-AR') : 'fecha desconocida';
  $('sheet-title').textContent='¿Restaurar este backup?';
  $('sheet-body').innerHTML=`
    <div class="confirm-text">Backup del ${fecha}. Esto reemplaza todo lo que tenés cargado hoy (Carta, semana, Compras, Mis Reglas) por lo del backup. Esta acción no se puede deshacer.</div>
    <div class="confirm-actions">
      <button class="btn-cancel-m" onclick="closeSheet({target:$('sheet')})">Cancelar</button>
      <button class="btn-danger" onclick="ejecutarRestaurarBackup()">Sí, restaurar</button>
    </div>
  `;
  $('sheet').classList.add('open');
}

function ejecutarRestaurarBackup(){
  if(!backupPendiente){closeSheet({target:$('sheet')});return;}
  // Acepta backups viejos (claves menufy_*) y nuevos (menutwist_*); solo restaura claves conocidas.
  Object.entries(backupPendiente.datos).forEach(([k,v])=>{
    const nk=String(k).replace(/^menufy_/,'menutwist_');
    if(MT_BACKUP_KEYS.includes(nk)&&typeof v==='string')localStorage.setItem(nk,v);
  });
  backupPendiente=null;
  closeSheet({target:$('sheet')});
  cargar();
  renderReglas();
  irA(weekStarted?'principal':'landing');
  toast('Backup restaurado');
  mtTrack('backup_restaurado');
}

const MT_APP_VERSION='12.5.136';
const MT_TRACK_URL='https://script.google.com/macros/s/AKfycbwSHSJ-plhEelVYxBzWfHjhFE_jDI1b3k0-NJH3XVF4L_fJ4e58IXfBqy6LjL0QHhTz/exec';

function mtAnonId(){
  let id=localStorage.getItem('menutwist_anon_id');
  if(!id){
    id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    localStorage.setItem('menutwist_anon_id',id);
  }
  return id;
}

function mtSource(){
  let src=localStorage.getItem('menutwist_src');
  if(!src){
    const params=new URLSearchParams(location.search);
    src=(params.get('src')||'directo').toLowerCase().trim().replace(/\s+/g,'-');
    localStorage.setItem('menutwist_src',src);
  }
  return src;
}

function mtFechaLocal(){
  const now=new Date();
  const utc=now.getTime()+now.getTimezoneOffset()*60000;
  const arg=new Date(utc-3*3600000);
  const p=n=>String(n).padStart(2,'0');
  return `${arg.getFullYear()}-${p(arg.getMonth()+1)}-${p(arg.getDate())}`;
}

function mtTrack(event,extra){
  if(location.hostname!=='menutwist.vercel.app')return; // solo la app real (no vistas previas ni pruebas)
  if(navigator.webdriver)return; // no contar robots
  if(MT_TRACK_URL.includes('PEGA_ACA_TU_URL')){
    console.warn('[MenuTwist] Tracking no configurado — falta pegar la URL real en MT_TRACK_URL.');
    return;
  }
  try{
    fetch(MT_TRACK_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({
        anonId:mtAnonId(),
        event:event||'',
        source:mtSource(),
        version:MT_APP_VERSION,
        extra:extra||''
      })
    });
  }catch(e){ }
}

function mtCheckStandalone(){
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  if(isStandalone&&!sessionStorage.getItem('menutwist_standalone_tracked')){
    sessionStorage.setItem('menutwist_standalone_tracked','1');
    mtTrack('abierta_como_app_instalada');
  }
}

function mtTrackRecurrencia(){
  const hoy=mtFechaLocal();
  const ultimo=localStorage.getItem('menutwist_ultimo_dia_activo');
  if(ultimo!==hoy){
    localStorage.setItem('menutwist_ultimo_dia_activo',hoy);
    mtTrack('dia_nuevo_activo');
  }
}

// Contexto básico (sin datos personales): sistema, modo de uso y navegador. Solo viaja con sesion_iniciada.
function mtContexto(){
  const ua=navigator.userAgent||'';
  const ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const sistema=ios?'iOS':/Android/.test(ua)?'Android':/Windows/.test(ua)?'Windows':/Macintosh/.test(ua)?'macOS':'otro';
  const instalada=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const navegador=/Edg/.test(ua)?'Edge':/CriOS|Chrome\//.test(ua)?'Chrome':/FxiOS|Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'otro';
  return `${sistema}·${instalada?'instalada':'navegador'}·${navegador}`;
}

// Eventos que deben contarse una sola vez por semana (por dispositivo).
function mtSemanaId(){
  try{return localStorage.getItem(LS_SEMANA_LUNES)||getLunesActualId();}catch(e){return '';}
}
function mtTrackUnaVezPorSemana(event,extra){
  try{
    const clave='menutwist_trk_'+event;
    const sem=mtSemanaId();
    if(!sem||localStorage.getItem(clave)===sem)return;
    localStorage.setItem(clave,sem);
  }catch(e){return;}
  mtTrack(event,extra);
}
// Se llama cada vez que se dibuja la Semana: registra el primer casillero y la semana resuelta.
function mtTrackProgresoSemana(llenos,total){
  if(llenos>0)mtTrackUnaVezPorSemana('planificacion_iniciada');
  if(total>0&&llenos>=total)mtTrackUnaVezPorSemana('semana_armada',String(total));
}
function mtTrackUnaVezPorSesion(event,extra){
  try{
    const clave='menutwist_trk_'+event;
    if(sessionStorage.getItem(clave))return;
    sessionStorage.setItem(clave,'1');
  }catch(e){return;}
  mtTrack(event,extra);
}

window.addEventListener('load',()=>{
  mtTrack('sesion_iniciada',mtContexto());
  mtCheckStandalone();
  mtTrackRecurrencia();
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape'||!$('sheet').classList.contains('open'))return;
  if(editandoSlot)cerrarComboSheet(); else closeSheet({target:$('sheet')});
});
cargar();
if(weekStarted){
  irA('principal');
} else {
  irA('landing');
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
