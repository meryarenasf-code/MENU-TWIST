<!DOCTYPE html>

<meta charset="UTF-8">
<script>
/* v131 — Bienvenida en la primera visita. Solo decide si mostrar bienvenida.html antes de que la app arranque.
   No lee ni modifica datos de la app: solo usa la clave propia "menutwist_bienvenida_vista".
   Nunca redirige: desde la app instalada, con ?app en la dirección, si ya hay datos de MenuTwist
   en este navegador, o si el navegador no deja guardar (así no hay bucles). */
(function(){
  try{
    var KEY='menutwist_bienvenida_vista';
    var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
    var directo=/[?&]app(=|&|$)/.test(location.search);
    if(standalone||directo){localStorage.setItem(KEY,'1');return;}
    if(localStorage.getItem(KEY))return;
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i)||'';
      if(k.indexOf('menutwist_')===0||k.indexOf('menufy_')===0){localStorage.setItem(KEY,'1');return;}
    }
    localStorage.setItem('menutwist_bienvenida_prueba','1');
    if(localStorage.getItem('menutwist_bienvenida_prueba')!=='1')return;
    localStorage.removeItem('menutwist_bienvenida_prueba');
    location.replace('bienvenida.html'+location.search+location.hash);
  }catch(e){}
})();
</script>

<style>
:root {
  --green:#B7D80A; --green-l:#F1F7D7; --green-d:#5a680d; --green-ink:#2E3804; /* v110: un solo lima, el de marca (--brand-lime apunta acá). --green-ink = texto sobre lima. */
  --blue:#10858b; --blue-l:#dceeee; --blue-d:#054346;
  --amber:#fd6c33; --amber-l:#ffe7dc; --amber-d:#b84a22;
  --red:#fa1d67; --red-l:#fce3ec; --red-d:#b01650;
  --purple:#B8124F; --purple-l:#f8e7ed; --purple-d:#7d0c36;
  --slate:#5d6b7a; --slate-d:#3e4c5c;
  --ice:#eaf2f7; --ice-d:#6f9bb3;
  --terracotta:#f5e8e0; --terracotta-d:#b97a5c;
  --pl-olive:var(--green); --pl-orange:#fc6d38; --pl-pink:#f82269; --pl-teal:#3d9096;
  --pl-olive-l:var(--green-l); --pl-orange-l:#ffae7d; --pl-pink-l:#ff5a9b;
  --brand-petrol:#0D6B69; --brand-petrol-vivo:#17AC8E; --brand-petrol-vivo-l:#dcf2ee; --brand-naranja:#FF6F1F; --brand-naranja-l:#ffe9dd; --brand-lime:var(--green);
  --g0:#ffffff; --g1:#f9fafb; --g2:#f3f4f6; --g3:#e5e7eb;
  --g4:#d1d5db; --g5:#9ca3af; --g6:#6b7280; --g7:#374151; --g8:#3e4c5c;
  --text:#111827; --text2:#374151; --text3:#6b7280; --text4:#6f7782; /* v112: antes #9ca3af (2,5:1); ahora 4,5:1 */
  --border:#e5e7eb; --border2:#d1d5db;
  --r:10px; --r-sm:12px; --r-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:var(--font);color:var(--text);background:var(--g1);overscroll-behavior-y:contain;}
.app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;background:var(--g1);position:relative;overscroll-behavior-y:contain;}
.screen{display:none;flex-direction:column;flex:1;min-height:0;}
.screen.on{display:flex;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:16px;}
.bnav{display:flex;border-top:1px solid var(--border);background:var(--g0);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0);}
.bnav-item{flex:1;padding:11px 4px 13px;background:none;border:none;cursor:pointer;font-family:var(--font);color:var(--text4);transition:color .15s;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;}
.bnav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.bnav-item.on{color:var(--brand-petrol);font-weight:700;}
.bnav-item.on svg{stroke-width:2.2;}
.bnav-item .bnav-dot{width:4px;height:4px;border-radius:50%;background:var(--brand-petrol);opacity:0;margin-top:-1px;transition:opacity .15s;}
.bnav-item.on .bnav-dot{opacity:1;}
.bnav-item span{font-size:12.5px;font-weight:600;}
.topbar{padding:18px 18px 0;flex-shrink:0;background:var(--g0);}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.screen-title{font-size:22px;font-weight:700;color:var(--text);}
.btn-add-top{font-size:12.5px;font-weight:600;padding:9px 13px;border-radius:20px;background:var(--green);color:var(--green-ink);border:none;cursor:pointer;font-family:var(--font);flex-shrink:0;}
.btn-reglas-top{font-size:15px;padding:9px 11px;border-radius:20px;background:var(--g2);color:var(--text2);border:none;cursor:pointer;font-family:var(--font);flex-shrink:0;}
.btn-add-top:active{background:var(--green-d);}
.landing-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:20px 22px 24px;position:relative;}
.landing-scroll>*{position:relative;z-index:1;}
.landing-week-block{margin-bottom:26px;}
.landing-empty-card{width:100%;border:1.5px dashed var(--brand-naranja);border-radius:var(--r-lg);padding:26px 20px;text-align:center;background:linear-gradient(160deg,rgba(255,111,31,.06),rgba(183,216,10,.05));cursor:pointer;font-family:var(--font);}
.landing-empty-icon{width:36px;height:36px;margin:0 auto 10px;color:var(--brand-petrol);}
.landing-empty-icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.landing-empty-title{font-size:15.5px;font-weight:700;color:var(--text2);}
.landing-empty-sub{font-size:12.5px;color:var(--text3);margin-top:4px;line-height:1.45;}
.landing-continue-card{width:100%;display:flex;flex-direction:column;gap:0;border:none;border-left:4px solid var(--brand-petrol-vivo);border-radius:var(--r-lg);padding:16px 18px 15px;background:var(--g0);box-shadow:0 2px 14px rgba(30,41,59,.07);cursor:pointer;font-family:var(--font);text-align:left;}
.landing-continue-top{display:flex;align-items:center;gap:12px;}
.landing-continue-emoji{width:34px;height:34px;border-radius:50%;background:#E4F5F0;color:var(--brand-petrol);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.landing-continue-emoji svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
/* v107: la tarjeta sigue el estado de la semana, igual que Semana: petróleo vivo en proceso, lima completa. */
.landing-continue-card.completa{border-left-color:var(--brand-lime);}
.landing-continue-card.completa .landing-continue-emoji{background:var(--green-l);color:var(--green-d);}
.landing-continue-label{font-size:10.5px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.05em;}
.landing-continue-title{font-size:15px;font-weight:700;color:var(--text);margin-top:1px;}
.landing-continue-arrow{margin-left:auto;color:var(--text4);display:flex;}
.landing-continue-arrow .ic{width:18px;height:18px;vertical-align:0;}
.landing-day-dots{display:flex;gap:5px;margin-top:13px;}
.landing-day-dot{flex:1;height:6px;border-radius:4px;background:var(--g3);position:relative;overflow:hidden;}
/* v106: sin degradés. Media = mitad izquierda en petróleo vivo (pseudo-elemento sólido); completo = petróleo vivo;
   toda la semana activa completa = lima, igual que "¡Semana resuelta!" en Semana. */
.landing-day-dot.half::after{content:'';position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--brand-petrol-vivo);}
.landing-day-dot.full{background:var(--brand-petrol-vivo);}
.landing-day-dots.completa .landing-day-dot.full{background:var(--brand-lime);}
.landing-continue-meta{font-size:11.5px;color:var(--text3);margin-top:8px;font-weight:600;}
.landing-carousel-title{font-size:13px;font-weight:700;color:var(--text2);margin:0 0 10px 8px;text-align:left;}
.landing-carousel{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;gap:20px;scrollbar-width:none;padding:0 8px 4px;margin-bottom:6px;}
.landing-carousel::-webkit-scrollbar{display:none;}
.landing-card{flex:1 1 140px;min-width:140px;max-width:220px;height:64px;border-radius:14px;border:2px solid var(--border2);background:var(--g0);display:flex;align-items:center;justify-content:center;gap:9px;padding:0 12px;cursor:pointer;font-family:var(--font);text-align:left;}
.landing-card-emoji{font-size:19px;flex-shrink:0;}
.landing-card-icon{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.landing-card-label{font-size:12px;font-weight:700;line-height:1.2;text-transform:uppercase;letter-spacing:.02em;}
.brand-row{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:10px;}
.brand-mark{width:76px;height:76px;flex-shrink:0;object-fit:contain;}
.brand-word{font-size:21px;font-weight:800;letter-spacing:-.01em;font-family:'Nunito',var(--font);display:inline-flex;}
.brand-word .wm-vivo{color:var(--brand-petrol-vivo);font-weight:800;}
.brand-word .wm-naranja{color:var(--brand-naranja);font-weight:800;}
.brand-tag{font-size:12px;font-weight:600;color:var(--brand-petrol);margin-top:-2px;letter-spacing:.01em;opacity:.85;}
.landing-foot{margin-top:26px;font-size:12px;color:var(--text4);text-align:center;line-height:1.5;}
.landing-hero{text-align:center;padding:2px 12px 4px;margin-bottom:20px;}
.landing-hero-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--brand-petrol);
  background:var(--g0);border:1px solid var(--border2);padding:4px 11px;border-radius:20px;
  margin-bottom:10px;letter-spacing:.01em;opacity:.9;}
.landing-hero-title{font-size:15px;font-weight:700;color:var(--brand-petrol);line-height:1.35;letter-spacing:-.01em;}
.landing-hero-title b{font-weight:800;}
.landing-hero-sub{font-size:12px;font-weight:500;color:var(--text3);margin-top:4px;line-height:1.5;opacity:.9;}
.gridhead{padding:18px 18px 4px;flex-shrink:0;}
/* v101 (2026-10-16): cabecera de Semana — título fijo, rango, progreso, componente contextual de 3 estados y acciones secundarias. */
.gridhead-title{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.01em;}
.gridhead-rango{font-size:13px;font-weight:600;color:var(--text3);margin-top:3px;}
.gh-progress{display:flex;align-items:center;gap:10px;margin-top:14px;}
.gh-progress-track{flex:1;height:6px;border-radius:4px;background:var(--g3);overflow:hidden;}
.gh-progress-bar{height:100%;width:0;border-radius:4px;background:var(--brand-petrol-vivo);transition:width .25s ease,background-color .25s ease;}
.gh-progress-bar.completa{background:var(--brand-lime);}
.gh-progress-txt{font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums;}
.autocomplete-wrap{margin:14px 18px 12px;position:relative;}
/* v105: shuffle dentro de "¡Semana resuelta!" — botón hermano superpuesto (no anidado), solo visible en estado completa. */
.wk-cta-dice{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:none;background:var(--g0);color:var(--green-d);display:none;align-items:center;justify-content:center;cursor:pointer;}
.wk-cta-dice svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.wk-cta-dice:active{background:var(--g2);}
.wk-cta-dice:focus-visible{outline:2px solid var(--green-d);outline-offset:2px;}
.wk-cta-dice.on{display:flex;}
.wk-cta--completa{padding-right:64px;}
.wk-cta{--cta:var(--brand-naranja);--cta-l:#FFF0E5;--cta-ico:#A8430E;
  width:100%;min-height:68px;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;
  border:none;border-left:4px solid var(--cta);border-radius:var(--r-sm);background:var(--cta-l);
  font-family:var(--font);text-align:left;cursor:pointer;color:var(--text);transition:background-color .2s ease,border-color .2s ease;}
.wk-cta:active{filter:brightness(.97);}
.wk-cta:focus-visible{outline:2px solid var(--cta-ico);outline-offset:2px;}
.wk-cta--parcial{--cta:var(--brand-petrol-vivo);--cta-l:#E4F5F0;--cta-ico:var(--brand-petrol);}
.wk-cta--completa{--cta:var(--brand-lime);--cta-l:var(--green-l);--cta-ico:var(--green-d);cursor:default;}
.wk-cta--completa:active{filter:none;}
.wk-cta[disabled]{opacity:1;}
.wk-cta-ico{width:38px;height:38px;border-radius:50%;background:var(--g0);color:var(--cta-ico);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.wk-cta-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.wk-cta-txt{flex:1;min-width:0;}
.wk-cta-title{font-size:15px;font-weight:800;color:var(--cta-ico);line-height:1.25;}
.wk-cta-sub{font-size:12.5px;font-weight:500;color:var(--text3);margin-top:2px;line-height:1.35;}
.wk-cta-arrow{width:18px;height:18px;flex-shrink:0;color:var(--cta-ico);stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.gh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.gh-more{width:40px;height:40px;flex-shrink:0;margin-top:-2px;border-radius:12px;border:1px solid var(--border2);background:var(--g0);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.gh-more svg{width:18px;height:18px;fill:currentColor;}
.gh-more:active{background:var(--g2);}
.gh-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 12px 12px;}
.gh-link{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 6px;border:none;background:none;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;border-radius:8px;}
.gh-link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.gh-link:active{background:var(--g2);}
.gh-link--vaciar{color:var(--text3);}
.gh-link--resumen{color:var(--brand-petrol);font-weight:700;}
.lista-gestion{display:flex;justify-content:space-between;gap:4px;margin-top:14px;padding-top:10px;border-top:1px solid var(--g2);}
.lista-gestion .gh-link{font-size:12.5px;padding:0 4px;}
.lista-gestion .gh-link--borrar{color:var(--red-d);}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
/* v109: emojis reemplazados por íconos de línea propios (mismo trazo que la barra inferior). */
.slot-icon-wrap .ic{width:15px;height:15px;vertical-align:0;color:var(--text3);}
.sheet-option-icon .ic{width:22px;height:22px;stroke-width:1.9;}
.icon-sugg{color:var(--green-d);} .icon-carta{color:var(--blue-d);} .icon-manual{color:var(--amber-d);}
.acept-opt .ic{width:24px;height:24px;stroke-width:1.7;color:var(--text3);vertical-align:0;}
.acept-opt.on .ic{color:var(--green-d);}
.combo-check .ic,.stock-edit-ok .ic{width:13px;height:13px;stroke-width:3;vertical-align:0;}
.resumen-btn .ic,.btn-reglas-top .ic,.carta-filtros-btn .ic,.btn-variante .ic,.sheet-option .ic-opt{width:16px;height:16px;}
.gh-menu-ico{background:var(--g0);color:var(--brand-petrol);}
.gh-menu-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.week-list{padding:0 18px;}
.day-card{background:var(--g0);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden;box-shadow:0 2px 10px rgba(30,41,59,.05);}
.day-card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;}
.day-card-name{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;}
.day-tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;background:var(--g2);color:var(--text3);}
.day-tag.rapido{background:var(--green-l);color:var(--green-d);}
.day-tag.normal{background:var(--blue-l);color:var(--blue-d);}
.day-tag.tiempo{background:var(--amber-l);color:var(--amber-d);}
.day-tag-btn{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;border:none;cursor:pointer;font-family:var(--font);}
.day-slots{border-top:1px solid var(--g2);}
.slot-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--g2);cursor:pointer;transition:background .1s;}
.slot-row:last-child{border-bottom:none;}
.slot-row:active{background:var(--g1);}
.slot-row.filled{cursor:default;}
.slot-row.empty{background:var(--g1);border-left:3px solid var(--g4);}
.slot-row.empty:active{background:var(--g2);}
.slot-row.empty .slot-empty-text{color:var(--text3);font-weight:600;font-style:normal;}
.slot-icon-wrap{width:28px;height:28px;border-radius:50%;background:var(--g2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.slot-body{flex:1;min-width:0;}
.slot-turno{font-size:10px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px;}
.slot-meal{font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;}
.slot-meal-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-guarni{font-size:12px;color:var(--text3);margin-top:1px;display:flex;}
.slot-guarni-tap{display:inline-flex;align-items:center;gap:3px;max-width:100%;overflow:hidden;border-bottom:1px dashed var(--brand-petrol);color:var(--brand-petrol);cursor:pointer;}
.slot-guarni-tap .guarni-tap-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-guarni-tap .guarni-tap-ico{font-size:10px;opacity:.75;flex-shrink:0;}
.slot-guarni-tap:active{color:var(--brand-petrol-vivo);border-color:var(--brand-petrol-vivo);}
.slot-empty-text{font-size:13px;color:var(--text4);font-style:italic;}
.slot-actions{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.slot-edit-btn{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);background:none;border:none;padding:4px 2px;cursor:pointer;font-family:var(--font);font-weight:500;}
.slot-edit-btn:active{color:var(--text);}
.slot-remove-btn{width:28px;height:28px;border-radius:50%;border:none;background:none;color:var(--text3);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.slot-remove-btn:active{color:var(--red);}
.heart-btn,.eye-btn,.edit-btn,.meal-del-btn,.slot-remove-btn,.slot-edit-btn{position:relative;}
.heart-btn::before,.eye-btn::before,.edit-btn::before,.meal-del-btn::before,.slot-remove-btn::before,.slot-edit-btn::before{
  content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%);
}
.heart-btn{width:28px;height:28px;background:none;border:none;cursor:pointer;flex-shrink:0;line-height:1;display:flex;align-items:center;justify-content:center;}

.manual-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.manual-title-row .manual-title{margin-bottom:0;}
.panel-close-btn{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:none;background:rgba(0,0,0,.08);color:var(--text2);font-size:13px;line-height:1;cursor:pointer;font-family:var(--font);}
.form-panel.edit-mode{background:var(--g0);border-bottom:1px solid var(--border);border-left:4px solid var(--blue);padding-left:14px;}
.form-panel.edit-mode{background:var(--blue-l);border-color:var(--border2);}
.manual-title{font-size:13px;font-weight:600;color:var(--amber-d);margin-bottom:8px;}
.edit-mode .manual-title{color:var(--blue-d);}
.manual-hint{font-size:11px;color:var(--amber-d);opacity:.8;margin-bottom:10px;}
.input{width:100%;font-size:14px;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--g0);font-family:var(--font);margin-bottom:8px;}
.input:focus{outline:none;border-color:var(--amber);}
.selects-row{display:flex;gap:8px;margin-bottom:10px;}
.sel-input{flex:1;font-size:12px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--g0);font-family:var(--font);}
.manual-actions{display:flex;gap:8px;}
.btn-confirm{flex:1;font-size:13px;font-weight:600;padding:10px;border-radius:var(--r-sm);background:var(--green);color:var(--green-ink);border:none;cursor:pointer;font-family:var(--font);}
.btn-cancel-m{flex:1;font-size:13px;padding:10px;border-radius:var(--r-sm);background:transparent;border:1px solid var(--border2);color:var(--text3);cursor:pointer;font-family:var(--font);}
.btn-variante{width:100%;margin-top:10px;font-size:12.5px;font-weight:600;padding:10px;border-radius:var(--r-sm);background:transparent;border:1px dashed var(--border2);color:var(--text3);cursor:pointer;font-family:var(--font);}
.btn-variante:active{background:var(--g1);}
.stock-card{margin:0 18px;background:var(--g0);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
.stock-sub{font-size:13px;color:var(--text3);padding:14px 16px 6px;}
.stock-sec{font-size:10px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.06em;padding:10px 16px 4px;}
.stock-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--g2);cursor:pointer;}
.stock-item label{flex:1;font-size:14px;cursor:pointer;}
.stock-item.done label{color:var(--text4);text-decoration:line-through;}
.stock-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--green);cursor:pointer;flex-shrink:0;}
.stock-item-icon{width:24px;height:24px;flex-shrink:0;border:none;background:none;color:var(--text4);font-size:13px;cursor:pointer;font-family:var(--font);}
.stock-qty-input{width:46px;flex-shrink:0;margin:0;padding:5px 6px;font-size:12.5px;text-align:center;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--g1);font-family:var(--font);}
.stock-item.editing{padding:8px 16px;gap:8px;}
.stock-edit-input{margin:0;flex:1;padding:6px 10px;font-size:14px;}
.stock-edit-ok{width:30px;height:30px;flex-shrink:0;border-radius:50%;border:none;background:var(--green);color:var(--green-ink);font-size:14px;cursor:pointer;font-family:var(--font);}
.stock-add-row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);}
.stock-add-row .input{margin:0;flex:1;}
.stock-add-row-card{margin:0 18px 18px;border:1px solid var(--border);border-radius:var(--r-lg);border-top:1px solid var(--border);}
.stock-empty{padding:30px 16px;font-size:14px;color:var(--text4);font-style:italic;text-align:center;}
.stock-vista-toggle{display:flex;gap:6px;padding:0 20px 12px;}
.stock-vista-btn{flex:1;font-size:12.5px;font-weight:600;padding:8px;border-radius:20px;border:1px solid var(--border2);background:var(--g0);color:var(--text3);cursor:pointer;font-family:var(--font);}
.stock-vista-btn.on{background:var(--brand-petrol);border-color:var(--brand-petrol);color:#fff;}
.stock-dia-block{margin:0 18px 14px;background:var(--g0);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
.stock-dia-title{font-size:14px;font-weight:700;padding:12px 16px;background:var(--g1);border-bottom:1px solid var(--g2);}
.stock-dia-plato{font-size:11.5px;font-weight:700;color:var(--text3);padding:10px 16px 2px;text-transform:uppercase;letter-spacing:.03em;}
.stock-footer{padding:14px 16px;border-top:1px solid var(--border);}
.btn-done{width:100%;padding:12px;border-radius:var(--r-sm);background:var(--green);color:var(--green-ink);border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-done:disabled{opacity:.4;}
.done-msg{background:var(--green-l);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;color:var(--green-d);margin-top:10px;text-align:center;display:none;font-weight:500;}
@keyframes pop{0%{transform:scale(.85);opacity:.5}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .22s ease;}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--g8);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:20px;z-index:200;display:none;animation:toastIn .18s ease;white-space:nowrap;}
/* ===== v112: ajustes de cierre de etapa 1 (al final para que prevalezcan) ===== */
.input,.combo-input,.carta-search,.sel-input,.plan-notas,.stock-qty-input,.stock-edit-input{font-size:16px;}
/* v112: textos chicos al mínimo legible */
.slot-turno,.day-tag,.day-tag-btn,.badge,.stock-sec,.resumen-table th,.acept-opt span,.pl-week-month{font-size:11px;}
.detalle-turno-label,.plan-notas-label,.combo-subtitle,.landing-continue-label,.pl-card-sub{font-size:11.5px;}
/* v112: selección siempre en petróleo de marca */
.carta-filtros-btn.on,.stock-vista-btn.on{background:var(--brand-petrol);border-color:var(--brand-petrol);color:#fff;}
.filtro-panel-check{color:var(--brand-petrol);}
/* v112: tiempo del día — se ve y se toca como botón */
.day-tag-btn{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:4px 10px;font-weight:600;border:1px solid rgba(5,67,70,.18);position:relative;}
.day-tag-btn::before{content:'';position:absolute;inset:-8px -4px;}
.day-tag-btn .ic{width:13px;height:13px;}
.day-tag-btn .ic-cambio{width:11px;height:11px;opacity:.7;}
/* v112: Inicio vacío con el mismo lenguaje que "¡Armemos tu semana!" */
.landing-empty-card{display:flex;align-items:center;gap:12px;text-align:left;border:none;border-left:4px solid var(--brand-naranja);background:#FFF0E5;padding:16px 14px 16px 12px;}
.landing-empty-icon{width:40px;height:40px;margin:0;border-radius:50%;background:var(--g0);color:#A8430E;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.landing-empty-icon svg{width:21px;height:21px;stroke-width:1.9;}
.landing-empty-title{color:#A8430E;font-size:15.5px;}
.landing-empty-sub{margin-top:2px;}
/* v112: colores de listas — mostaza (Comodines) y petróleo vivo (Express); lo tuyo en neutro */
:root{--mostaza:#E0A400;--mostaza-l:#FCF2D6;--mostaza-d:#7A5900;--vivo:var(--brand-petrol-vivo);--vivo-l:#E4F5F0;--vivo-d:var(--brand-petrol);}
.landing-card{border:1px solid transparent;border-left:4px solid var(--border2);justify-content:flex-start;padding:0 12px;}
.landing-card-label{text-transform:none;letter-spacing:0;font-size:14px;font-weight:800;}
.pl-card-sm{font-family:var(--font);text-align:left;background:var(--g0);}
.pl-mood-card.tuya{background:var(--g0);border:1px solid var(--border);border-left:4px solid var(--brand-petrol);}
/* v112: "¿Dónde ponemos…?" más liviano */
.donde-op{background:var(--g1)!important;}
/* v112: paneles de Carta sin color pleno */
.form-panel{background:var(--g0);border-bottom:1px solid var(--border);border-left:4px solid var(--brand-naranja);padding-left:14px;}
.form-panel.edit-mode{background:var(--g0);border-left-color:var(--brand-petrol);}
.edit-mode .manual-title{color:var(--brand-petrol);}
.edit-extra{display:flex;justify-content:space-between;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--g2);}
.edit-extra .gh-link{font-size:12.5px;padding:0 4px;}
.ff-badge-btn{position:relative;}
.ff-badge-btn::before{content:'';position:absolute;inset:-7px;}
.meal-badges{gap:10px;}
/* v113 — pantalla Listas: cuadrícula 2×2 + filas */
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 4px;}
.pl-tile{min-height:60px;border-radius:var(--r-sm);border:none;border-left:4px solid;display:flex;align-items:center;gap:9px;padding:8px 10px;font-family:var(--font);text-align:left;cursor:pointer;}
.pl-tile-icon{width:20px;height:20px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.pl-tile b{font-size:14px;font-weight:800;line-height:1.2;}
.pl-row{display:flex;align-items:center;gap:10px;width:calc(100% - 36px);margin:0 18px 8px;padding:11px 14px;min-height:56px;background:var(--g0);border:1px solid var(--border);border-left:4px solid var(--brand-petrol);border-radius:var(--r-sm);font-family:var(--font);text-align:left;cursor:pointer;}
.pl-row-txt{flex:1;min-width:0;}
.pl-row-title{font-size:14.5px;font-weight:800;color:var(--text);}
.pl-row-sub{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl-row-icon{width:18px;height:18px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.pl-row-chev{width:16px;height:16px;stroke:var(--text4);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.pl-ver-todas{display:block;margin:0 18px 4px;background:none;border:none;font-family:var(--font);font-size:13px;font-weight:700;color:var(--brand-petrol);padding:10px 0;cursor:pointer;}
.pl-card-sm .pl-card-sub{color:var(--text3);}
/* v114 — Inicio vacío en petróleo, títulos a 700, rayita lima por comida elegida */
.landing-empty-card{border-left-color:var(--brand-petrol);background:#E3EEEE;}
.landing-empty-icon,.landing-empty-title{color:var(--brand-petrol);}
.pl-tile b,.pl-row-title,.landing-card-label,.pl-mood-title{font-weight:700;}
.slot-row.filled{border-left:3px solid var(--green);}
/* v119 — "Agregar comida" en naranja suave (el lima queda para elegido/listo) */
.btn-add-top{background:#FFF0E5;color:#A8430E;box-shadow:inset 0 0 0 1.5px var(--brand-naranja);}
.btn-add-top:active{background:#FFE2CC;}
/* v121 — Inicio: playlists en cuadrícula 2×2 como en Listas */
.landing-carousel{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:visible;padding:0 2px 4px;}
.landing-card{max-width:none;min-width:0;height:60px;}
.landing-card.ancho{grid-column:1/-1;}
/* v124 — bajada de playlists en Inicio */
.landing-carousel-title{margin-bottom:2px;}
.landing-carousel-sub{font-size:12.5px;color:var(--text3);margin:0 0 10px 8px;text-align:left;line-height:1.4;}
/* v125 — corazón lleno = favorito (Carta, Listas, Inicio); de línea = sin marcar */
.ic-lleno path{fill:currentColor;}
/* v128 — Listas: textos de estado vacío cortos, en gris, sin cajas */
.pl-vacio{font-size:12.5px;color:var(--text3);padding:2px 18px 8px;}
/* v129 — Listas: mismo espacio entre cada título y su texto; Recientes solo con la fecha, todas iguales */
.pl-section-title{padding:20px 18px 3px;}
.pl-section-sub,.pl-vacio{font-size:12.5px;color:var(--text3);margin-top:0;padding:0 18px 10px;line-height:1.35;}
.pl-scroll-row{align-items:flex-start;}
.pl-semana{flex-shrink:0;width:96px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--g0);border:1px solid var(--border);border-top:3px solid var(--brand-petrol);border-radius:var(--r-sm);font-family:var(--font);cursor:pointer;padding:0;}
.pl-semana:active{background:var(--g1);}
.pl-semana .pl-week-range{font-size:19px;font-weight:800;color:var(--text);line-height:1;}
.pl-semana .pl-week-month{font-size:11.5px;color:var(--text3);opacity:1;margin:0;}
</style>
</head>

<script>
/* v12.5.109: las claves de almacenamiento pasaron de menufy_* a menutwist_*.
   La primera vez que se abre esta versión, se copian los datos existentes a las claves nuevas
   (las viejas quedan intactas como respaldo). Corre antes que cualquier otra lectura. */
(function mtMigrarClavesMenufy(){
  try{
    if(localStorage.getItem('menutwist_claves_migradas')==='1')return;
    const viejas=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('menufy_')===0)viejas.push(k);}
    viejas.forEach(k=>{
      const nk='menutwist_'+k.slice(7);
      if(localStorage.getItem(nk)===null)localStorage.setItem(nk,localStorage.getItem(k));
    });
    localStorage.setItem('menutwist_claves_migradas','1');
  }catch(e){}
  try{
    const sv=sessionStorage.getItem('menufy_standalone_tracked');
    if(sv&&!sessionStorage.getItem('menutwist_standalone_tracked'))sessionStorage.setItem('menutwist_standalone_tracked',sv);
  }catch(e){}
})();
// ============ DATOS ============

/* Freezer a nivel salsa (2026-09-30): a diferencia del plato entero, en una pasta simple
   lo que suele estar freezado es la salsa, no el fideo (ver hallazgo del 2026-09-29). Va
   por afuera de BIBLIOTECA porque una salsa no es un plato — es un string en SALSAS. Se
   guarda global (no por día): si tenés tuco freezado, da igual qué día/pasta lo use. Tiempos
   reales por salsa, confirmados con Mery y su propia experiencia de cocina (no un promedio
   parejo de 15 min como el de plato entero) — tDeCero = de cero, tFreezer = ya la tenés
   hecha y solo hay que descongelar+calentar. */
const SALSA_META={
  'Salsa fileto':{tDeCero:20,tFreezer:10},

function getIngsCasilleroParaComprar(dia,slot){
  const set=new Set();

}

/* Freezer con función real sobre el tiempo (2026-09-28): si el plato está marcado
   como "ya lo tenés freezado ahora", su tiempo de ejecución real pasa a ser el de
   descongelar+calentar+armar, no el de cocinarlo de cero. Tope simple y parejo
   para el MVP (no perfeccionismo): 15 minutos, y nunca más lento que su t original. */
const TIEMPO_FREEZER_DEFAULT=15;
/* v90 (2026-10-14): el plato freezado ya no "arrastra" a 15 min una guarnición que se hace
   de cero (milanesa freezada + puré). Guarnición y plato se hacen en paralelo, así que el
   tiempo real es el mayor de los dos. Las salsas usan SALSA_META (tFreezer si está freezada).
   Valores de GUARNI_T = estimación de cocina casera de cero; las que no figuran (ensaladas,
   cosas listas) se consideran rápidas. */
const GUARNI_T={'Papa hervida':25,'Papa al horno':45,'Papas al horno':45,'Papa a la crema':40,'Ensalada de papa y huevo':25,'Papas fritas':25,'Puré de papa':30,'Puré':30,'Puré de calabaza':30,'Puré de batata':35,'Batatas al horno':45,'Vegetales asados':40,'Verduras al horno':40,'Coliflor al horno':35,'Morrones rellenos queso y huevo':30,'Tomates cherries asados agridulces':25,'Arroz':20,'Arroz blanco':20,'Buñuelos de acelga':30,'Croquetas de papa':40,'Croquetas de jamón y queso':30,'Croquetas de arroz':35,'Bastones de muzzarella':20,'Papas noisette o arroz':30,'Puré o fideos':20,'Brócoli':15,'Choclo':10};
const TIEMPO_HERVIR_PASTA=15;
function tiempoGuarni(txt){
  let t=0;
  String(txt||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(g=>{
    const meta=SALSA_META[g];
    const tg=meta?(salsasFreezadas[g]?meta.tFreezer:meta.tDeCero):(GUARNI_T[g]||0);
    if(tg>t)t=tg;
  });
  return t;
}
/* v118: en pastas que no van al horno, el tiempo lo marca la salsa elegida (se hace mientras
   hierve el agua): el mayor entre hervir la pasta y la salsa (de cero o freezada). Antes se usaba
   un tiempo fijo por plato que traía la salsa por defecto adentro (Ravioles 80 por el Estofado). */
const tiempoPastaConSalsa=(c,g)=>{
  if(!c||c.cat!=='Pastas'||c.alHorno)return null;
  const meta=SALSA_META[g];if(!meta)return null;
  return Math.max(TIEMPO_HERVIR_PASTA,salsasFreezadas[g]?meta.tFreezer:meta.tDeCero);
};
const tiempoEfectivo=(c,guarniTxt)=>{
  if(!c)return undefined;
  if(!c.freezer){const tp=tiempoPastaConSalsa(c,guarniTxt===undefined?(c.guarni||''):guarniTxt);return tp!=null?tp:c.t;}
  const g=guarniTxt===undefined?(c.guarni||''):guarniTxt;
  const base=Math.min(c.t,TIEMPO_FREEZER_DEFAULT);
  if(c.guarniIncluida&&g===c.guarni)return base;
  return Math.max(base,tiempoGuarni(g));
};
/* Tiempo efectivo de un casillero ya asignado, sumando el freezer de plato entero (arriba)
   y, para pastas, el freezer de salsa (2026-09-30): si la salsa elegida ese día está marcada
   "ya la tenés hecha", el tiempo real del casillero es el tFreezer de esa salsa (hervir la
   pasta y calentar la salsa pasan en paralelo), no el t del plato completo. Si el plato entero
   ya está freezado, ese caso manda (una lasagna freezada no necesita mirar su salsa interna). */
function tiempoEfectivoSlot(dia,slot){
  const c=getC(menu[dia]?.[slot]);
  if(!c)return 999;
  const g=guarniReal(dia,slot);
  if(c.freezer)return tiempoEfectivo(c,g);
  // v90: salsa freezada en pasta → igual hay que hervir la pasta (piso 15 min). En pastas
  // que se arman y van al horno (canelones, lasagna) la salsa hecha no acorta el horno.
  const tp=tiempoPastaConSalsa(c,g);
  return tp!=null?tp:c.t;
}

function apagarFreezerUsado(menuUsado){

}

const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function rangoSemana(){
  const hoy=new Date();
  const dow=(hoy.getDay()+6)%7;
  const lunes=new Date(hoy);lunes.setDate(hoy.getDate()-dow);
  const domingo=new Date(lunes);domingo.setDate(lunes.getDate()+6);
  const mismoMes=lunes.getMonth()===domingo.getMonth();
  // Formato corto en el caso de cruce de mes (antes "28 de septiembre al 4 de octubre" quedaba largo/apretado).
  const txt=mismoMes
    ? `${lunes.getDate()} al ${domingo.getDate()} de ${capFirst(MESES[domingo.getMonth()])}`
    : `${lunes.getDate()} ${MESES[lunes.getMonth()].slice(0,3)} al ${domingo.getDate()} ${MESES[domingo.getMonth()].slice(0,3)}`;
  return `Semana del ${txt}`;
}

  `;
  $('sheet').classList.add('open');

function reshuffleSemana(){
  const dias=diasActivos();
  // v105: los platos que había se evitan en la propuesta nueva (si hay alternativas que cumplan las demás reglas).
  evitarEnShuffle=new Set();
  dias.forEach(d=>['m','n'].forEach(s=>{const c=getC(menu[d][s]);if(c)evitarEnShuffle.add(c.id);}));
  dias.forEach(d=>{menu[d]={m:null,n:null,gm:'',gn:'',notas:menu[d].notas||''};});
  let hechos=0,sinOpcion=0;
  dias.forEach(d=>{
    ['m','n'].forEach(s=>{
      const el=calcShuffle(d,s,false);
      if(el){menu[d][s]=el.id;menu[d][s==='m'?'gm':'gn']=el.guarni||'';hechos++;}
      else sinOpcion++;
    });
  });
  evitarEnShuffle=null;
  closeSheet({target:$('sheet')});
  renderPrincipal();
  if(hechos)mtTrack('sugerencia_utilizada','otra_combinacion');
  guardar();
  if(sinOpcion)toast(`Volvimos a armar tu semana · ${sinOpcion} casillero${sinOpcion>1?'s':''} sin opción que entre en el tiempo`);
  else toast(hechos ? 'Volvimos a armar tu semana' : 'No había nada para rearmar');
}

function renderGrilla(){
  $('week-list').innerHTML=DIAS_SEM.map(d=>diaCardHTML(d,false)).join('');
  if(findeMostrado){
    $('finde-section').style.display='block';
    $('finde-list').innerHTML=DIAS_FIN.map(d=>diaCardHTML(d,true)).join('');
    $('finde-toggle').textContent='− Ocultar fin de semana';
  } else {
    $('finde-section').style.display='none';
    $('finde-toggle').textContent='+ Agregar fin de semana';
  }
  const dias=diasActivos();
  const totalSlots=dias.length*2;
  const filledSlots=dias.reduce((n,d)=>n+(menu[d].m?1:0)+(menu[d].n?1:0),0);
  const hayVacios=filledSlots<totalSlots;
  const btn=$('btn-autocomplete');
  // v101: mismo comportamiento que v100 en los tres estados:
  // vacía y parcial → completarSemanaAuto() (solo llena casilleros vacíos); completa → informativo, sin acción.
  const estado=!hayVacios?'completa':(filledSlots===0?'vacia':'parcial');
  const faltan=totalSlots-filledSlots;
  const plural=n=>n===1?'comida':'comidas';
  const ICO={
    vacia:'<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
    parcial:'<path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8 19 13M17.8 6.2 19 5M12.2 6.2 11 5"/><path d="M3 21l9-9"/>',
    completa:'<polyline points="20 6 9 17 4 12"/>'
  };
  const TXT={
    vacia:['¡Armemos tu semana!','Completar mi semana'],
    parcial:['Completar las que faltan',`Te ${faltan===1?'queda':'quedan'} ${faltan} ${plural(faltan)} por elegir`],
    completa:['¡Semana resuelta!',`Ya tenés ${totalSlots} ${plural(totalSlots)} elegidas`]
  };
  btn.className='wk-cta wk-cta--'+estado;
  btn.toggleAttribute('disabled',estado==='completa');
  btn.onclick=estado==='completa'?null:completarSemanaAuto;
  btn.setAttribute('aria-label',TXT[estado][0]+'. '+TXT[estado][1]);
  btn.innerHTML=`<span class="wk-cta-ico"><svg viewBox="0 0 24 24">${ICO[estado]}</svg></span>
    <span class="wk-cta-txt"><span class="wk-cta-title" style="display:block">${TXT[estado][0]}</span><span class="wk-cta-sub" style="display:block">${TXT[estado][1]}</span></span>
    ${estado==='completa'?'':'<svg class="wk-cta-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'}`;
  $('btn-otra-combinacion').classList.toggle('on',estado==='completa');
  const bar=$('gh-progress-bar');
  bar.style.width=(totalSlots?filledSlots/totalSlots*100:0)+'%';
  bar.classList.toggle('completa',estado==='completa');
  $('gh-progress-txt').textContent=`${filledSlots} de ${totalSlots} ${plural(totalSlots)}`;
  mtTrackProgresoSemana(filledSlots,totalSlots);
}

function guardarGustoManual(d,s){
  const k=d.replace(/\s/g,'_');
  const inp=$(`gi-${k}-${s}`);
  const val=inp?.value?.trim();
  if(!val)return;
  const nombre=capFirst('empanadas de '+val.toLowerCase());
  let existente=biblioteca.find(c=>c.cat==='Empanadas'&&normTxt(c.nombre)===normTxt(nombre));
  let nid;
  if(existente){
    nid=existente.id;
  } else {
    nid=String(nextId++);
    biblioteca.push({id:nid,nombre,guarni:'',cat:'Empanadas',freezer:false,lunchera:false,acept:3,t:15,manual:true,favorito:false,oculto:false,restr:['hidratos'],prot:null,turno:'ambos',standalone:true});
  }
  toggleGustoEmpanada(d,s,nid);
  toast(existente?`Ya tenías "${nombre}" — la sumamos a la tanda`:`"${nombre}" agregado a tu Carta`);
}
function toggleGustoEmpanada(d,s,flavorId,e){
  if(e)e.stopPropagation();
  const actual=(menu[d][s]||'').split('+').filter(Boolean);
  let nuevo=actual.includes(flavorId)?actual.filter(x=>x!==flavorId):[...actual,flavorId];
  if(!nuevo.length)nuevo=actual;
  const ordenBiblioteca=biblioteca.filter(c=>c.cat==='Empanadas').map(c=>c.id);
  nuevo=ordenBiblioteca.filter(id=>nuevo.includes(id));
  menu[d][s]=nuevo.join('+');
  renderPrincipal();
  renderComboSheet();
  guardar();
}
function resumenSemanaGuarni(dia,slot,isP){
  const filas=[];
  diasActivos().forEach(d=>{
    ['m','n'].forEach(s=>{
      if(d===dia&&s===slot)return;
      const mealId=menu[d][s];
      if(!mealId)return;
      if(esEmpanada(mealId))return;
      if(isPasta(mealId)!==isP)return;
      const g=guarniReal(d,s);
      if(!g)return;
      filas.push({dia:d,slot:s,texto:g});
    });
  });
  return filas;
}
function resumenSemanaHTML(dia,slot,isP){
  const filas=resumenSemanaGuarni(dia,slot,isP);
  if(!filas.length)return '';
  const label=isP?'Salsas que ya elegiste esta semana':'Acompañamientos que ya elegiste esta semana';
  return `<div class="combo-resumen-semana">
    <div class="combo-subtitle" style="margin:0 0 4px">${label}</div>
    ${filas.map(f=>`<div class="combo-resumen-fila"><b>${f.dia} ${f.slot==='m'?IC_SUN:IC_MOON}</b> — ${f.texto}</div>`).join('')}
  </div>`;

const GRUPO_GUARNI_PAPAS=['Papa hervida','Papa al horno','Papa a la crema','Papas fritas','Puré de papa','Puré de calabaza','Puré de batata','Batatas al horno','Arroz'];
const GRUPO_GUARNI_VERDURAS=['Vegetales asados','Tomate cherry','Choclo','Brócoli','Coliflor al horno','Ensalada de tomate y lechuga','Ensalada de rúcula y parmesano','Ensalada mixta','Ensalada verde','Ensalada de remolacha y huevo','Ensalada de papa y huevo','Morrones rellenos queso y huevo','Tomates cherries asados agridulces','Ensalada caprese (tomate cherry, albahaca y queso)','Coleslaw'];
const GRUPO_GUARNI_PICOTEO=['Buñuelos de acelga','Croquetas de papa','Bastones de muzzarella','Croquetas de jamón y queso','Croquetas de arroz'];
function agruparGuarniciones(opts){
  const g={solo:[],papas:[],verduras:[],picoteo:[],otros:[]};
  opts.forEach(x=>{
    if(x==='Solo')g.solo.push(x);
    else if(GRUPO_GUARNI_PAPAS.includes(x))g.papas.push(x);
    else if(GRUPO_GUARNI_VERDURAS.includes(x))g.verduras.push(x);
    else if(GRUPO_GUARNI_PICOTEO.includes(x))g.picoteo.push(x);
    else g.otros.push(x);
  });
  return g;
}
function comboHTML(mealId,dia,slot,guarniVal){
  if(esEmpanada(mealId))return comboEmpanadasHTML(mealId,dia,slot);
  const isP=isPasta(mealId);
  const isW=tieneProteinaOpcional(mealId);
  const modoUnico=isP||isW;
  const opts=isW?opcionesProteina(mealId):(isP?SALSAS:GUARNICIONES_BANK);
  const label=isW?(getC(mealId)?.fajitaProteina?'Elegí la proteína':'Elegí la proteína (opcional)'):(isP?'Elegí la salsa':'Acompañamiento (podés combinar varios)');
  const seleccionG=modoUnico?[]:(guarniVal||'').split(',').map(x=>x.trim()).filter(Boolean);
  const filaHTML=g=>{
    const sel=modoUnico?guarniVal===g:seleccionG.includes(g);
    const marcador=modoUnico?`<span class="combo-radio"></span>`:`<span class="combo-check">${sel?'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>':''}</span>`;
    const onClick=modoUnico?`setGuarni('${dia}','${slot}','${g}')`:`toggleGuarniItem('${dia}','${slot}','${g}',event)`;
    /* Freezer a nivel salsa (2026-09-30): solo en el picker de pastas, y solo para las
       9 salsas reales de SALSA_META ("Otra" y las que el usuario escribe a mano quedan afuera). */
    const meta=isP?SALSA_META[g]:null;
    const salsaTiempoHTML=meta?`<span style="font-size:11px;color:var(--text4);flex-shrink:0">${salsasFreezadas[g]?`${meta.tFreezer}min ${IC_SNOW}`:`${meta.tDeCero}min`}</span>`:'';
    const salsaFreezBtnHTML=meta?`<button class="ff-badge-btn freezer${salsasFreezadas[g]?' on':''}" onclick="toggleFreezerSalsa('${g}',event)" title="¿Ya la tenés hecha?">${freezerIcon}</button>`:'';
    return `<div class="combo-row-item${sel?' sel':''}" onclick="${onClick}">${marcador}<span class="combo-row-label">${g}</span>${salsaTiempoHTML}${salsaFreezBtnHTML}</div>`;
  };
  const filaHTMLBorrable=g=>{
    const sel=seleccionG.includes(g);
    return `<div class="combo-row-item${sel?' sel':''}">
      <span class="combo-row-click" onclick="toggleGuarniItem('${dia}','${slot}','${g}',event)"><span class="combo-check">${sel?'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>':''}</span><span class="combo-row-label">${g}</span></span>
      <button class="combo-row-del" onclick="eliminarGuarniCustom('${dia}','${slot}','${g}',event)" title="Sacar esta opción del listado">${removeIcon}</button>
    </div>`;
  };
  let listaHTML;
  if(modoUnico){
    listaHTML=`<div class="combo-list">${opts.map(filaHTML).join('')}</div>`;
  } else {
    const g=agruparGuarniciones(opts);
    listaHTML=[
      g.solo.length?`<div class="combo-list">${g.solo.map(filaHTML).join('')}</div>`:'',
      g.papas.length?`<div class="combo-group-title">Papas, arroz y purés</div><div class="combo-list">${g.papas.map(filaHTML).join('')}</div>`:'',
      g.verduras.length?`<div class="combo-group-title">Verduras y ensaladas</div><div class="combo-list">${g.verduras.map(filaHTML).join('')}</div>`:'',
      g.picoteo.length?`<div class="combo-group-title">Para sumar / picotear</div><div class="combo-list">${g.picoteo.map(filaHTML).join('')}</div>`:'',
      g.otros.length?`<div class="combo-group-title">Agregados por vos</div><div class="combo-list">${g.otros.map(filaHTMLBorrable).join('')}</div>`:'',
    ].join('');
  }
  return `<div class="combo-sheet-body">
    <div class="combo-title">${label}</div>
    ${isW?'':resumenSemanaHTML(dia,slot,isP)}
    ${listaHTML}
    <div class="combo-row">
      <input class="combo-input" id="ci-${dia.replace(/\s/g,'_')}-${slot}" placeholder="Escribí otra…">
      <button class="combo-save" onclick="guardarGuarni('${dia}','${slot}')">${modoUnico?'OK':'+ Agregar'}</button>
    </div>
    ${modoUnico?'':'<button class="combo-sheet-done" onclick="cerrarComboSheet()">Listo</button>'}
  </div>`;
}

function recalcularPorTiempo(d){
  const excedidos=comidasQueNoEntran(d);

  let hechos=0;
  excedidos.forEach(x=>{
    const el=calcShuffle(d,x.slot,false);
    if(el){menu[d][x.slot]=el.id;menu[d][x.slot==='m'?'gm':'gn']=el.guarni||'';hechos++;}

function guardarGuarni(d,s){
  const k=d.replace(/\s/g,'_');
  const i=$(`ci-${k}-${s}`);
  const val=i?.value.trim();
  if(!val)return;
  const mealId=menu[d][s];
  const key=s==='m'?'gm':'gn';
  if(tieneProteinaOpcional(mealId)){
    const lp=opcionesProteina(mealId);
    if(!lp.includes(val))lp.splice(lp===PROTEINAS_FAJITAS?lp.length:lp.length-1,0,val);
    menu[d][key]=val;
    cerrarComboSheet();guardar();
    return;
  } else if(isPasta(mealId)){
    if(!SALSAS.includes(val))SALSAS.splice(SALSAS.length-1,0,val);
    menu[d][key]=val;
    cerrarComboSheet();guardar();
    return;
  } else {
    if(!GUARNICIONES_BANK.includes(val))GUARNICIONES_BANK.splice(GUARNICIONES_BANK.length-1,0,val);
    if(!guarniBank.includes(val))guarniBank.push(val);
    const actual=(menu[d][key]||'').split(',').map(x=>x.trim()).filter(Boolean);
    if(!actual.includes(val))actual.push(val);
    menu[d][key]=actual.join(', ');
  }
  renderPrincipal();renderComboSheet();guardar();
}

function completarSemanaAuto(){
  let hechos=0,sinOpcion=0;
  diasActivos().forEach(d=>{
    ['m','n'].forEach(s=>{
      if(!menu[d][s]){
        const el=calcShuffle(d,s,false);
        if(el){menu[d][s]=el.id;menu[d][s==='m'?'gm':'gn']=el.guarni||'';hechos++;}
        else sinOpcion++;
      }
    });
  });
  renderPrincipal();
  guardar();
  if(hechos)mtTrack('sugerencia_utilizada','completar_semana');
  if(sinOpcion)toast(`${hechos?`Completamos ${hechos}. `:''}${sinOpcion} quedaron vacíos: no hay platos que entren en ese tiempo`);
  else toast(hechos ? `Completamos ${hechos} casillero${hechos>1?'s':''} automáticamente` : 'No quedaban casilleros vacíos');
}
const CATS_ESPACIADAS=['Milanesas','Pastas','Tartas','Empanadas'];
let evitarEnShuffle=null;

function calcShuffle(dia,slot,novedoso){
  const maxT=getMaxT(dia);
  const ordenDias=[...DIAS_SEM,...DIAS_FIN];
  const diaIdx=ordenDias.indexOf(dia);
  const ordenSlots=[];
  ordenDias.forEach(d=>['m','n'].forEach(s=>ordenSlots.push({d,s})));
  const idxActual=ordenSlots.findIndex(x=>x.d===dia&&x.s===slot);
  const usadasId=new Set();
  const catPorDia={};
  const protPorDia={};
  let pastas=0,pescados=0;
  ordenDias.forEach((d,i)=>['m','n'].forEach(s=>{
    if(d===dia&&s===slot)return;
    const c=getC(menu[d][s]);if(!c)return;
    usadasId.add(c.id);
    (catPorDia[i]??=new Set()).add(c.cat);
    const protReal=c.prot?[c.prot]:(tieneProteinaOpcional(c.id)?protsDeOpcion(guarniReal(d,s)):[]);
    protReal.forEach(p=>(protPorDia[i]??=new Set()).add(p));
    if(c.cat==='Pastas')pastas++;
    if(c.cat==='Pescados y mariscos'||c.prot==='pescado')pescados++;
  }));
  const catAdyacente=new Set();
  [idxActual-1,idxActual+1].forEach(i=>{
    if(i<0||i>=ordenSlots.length)return;
    const {d,s}=ordenSlots[i];
    const c=getC(menu[d][s]);
    if(c)catAdyacente.add(c.cat);
  });
  const catUsadaCerca=cat=>{
    if(!CATS_ESPACIADAS.includes(cat))return false;
    for(let off=-1;off<=1;off++){const s=catPorDia[diaIdx+off];if(s&&s.has(cat))return true;}
    return false;
  };
  const protAyer=protPorDia[diaIdx-1]||new Set();
  /* v102 (2026-10-16) — reglas de Mery para el armado automático (nunca pisan una elección manual):
     1) Sushi (soloSiFavorito) nunca entra salvo que la familia lo marque como favorito.
     2) No repetir la misma proteína en el mismo día (veg no cuenta). Si no hay otra opción, se permite.
     3) Lunes a viernes al mediodía: primero platos aptos lunchera; si no hay ninguno disponible,
        platos típicos de mediodía (se excluyen los marcados turno:'noche'). Fin de semana: sin cambios. */
  const protHoy=protPorDia[diaIdx]||new Set();
  const esMediodiaSemana=slot==='m'&&DIAS_SEM.includes(dia);
  const autoOK=c=>!(c.soloSiFavorito&&!c.favorito);
  const protOK=c=>{const ps=c.prot?[c.prot]:(tieneProteinaOpcional(c.id)?protsDeOpcion(c.guarni||''):[]);return !ps.some(p=>p!=='veg'&&protHoy.has(p));};
  const turnoOK=c=>!(esMediodiaSemana&&c.turno==='noche');

  let cands;
  if(novedoso){
    cands=biblioteca.filter(c=>!c.personalizable&&!c.sinAzar&&(c.oculto||c.acept<=3)&&!usadasId.has(c.id)&&!(c.cat==='Pastas'&&pastas>=2)&&respetaRestricciones(c));
    if(!cands.length)cands=biblioteca.filter(c=>!c.personalizable&&!c.sinAzar&&!usadasId.has(c.id)&&!c.oculto&&respetaRestricciones(c));
  } else {
    let base=biblioteca.filter(c=>autoOK(c)&&!c.personalizable&&!c.sinAzar&&tiempoEfectivo(c)<=maxT&&!usadasId.has(c.id)&&!c.oculto&&!(c.cat==='Pastas'&&pastas>=2)&&respetaRestricciones(c));
    if(!base.length)base=biblioteca.filter(c=>autoOK(c)&&!c.personalizable&&!c.sinAzar&&tiempoEfectivo(c)<=maxT&&!c.oculto&&!(c.cat==='Pastas'&&pastas>=2)&&respetaRestricciones(c));
    if(!base.length)base=biblioteca.filter(c=>autoOK(c)&&!c.personalizable&&!c.sinAzar&&tiempoEfectivo(c)<=maxT&&!c.oculto&&respetaRestricciones(c));
    const estricta=base.filter(c=>protOK(c)&&turnoOK(c));
    if(estricta.length)base=estricta;
    else{const soloTurno=base.filter(turnoOK);if(soloTurno.length)base=soloTurno;}
    if(esMediodiaSemana){const lunch=base.filter(c=>c.lunchera);if(lunch.length)base=lunch;}
    if(evitarEnShuffle&&evitarEnShuffle.size){const nuevos=base.filter(c=>!evitarEnShuffle.has(c.id));if(nuevos.length)base=nuevos;}
    if(!base.length){cands=[];}
    else{
      const penalidad=c=>{
        let p=0;
        if(catAdyacente.has(c.cat))p+=3;
        if(catUsadaCerca(c.cat))p+=2;
        if(c.prot&&protAyer.has(c.prot))p+=1;
        if(pescados===0&&(c.cat==='Pescados y mariscos'||c.prot==='pescado'))p-=1;
        return p;
      };
      const minP=Math.min(...base.map(penalidad));
      cands=base.filter(c=>penalidad(c)===minP);
    }
  }
  if(!cands.length)return null;
  const pool=[];
  cands.forEach(c=>{
    const peso=(novedoso?(c.oculto?3:1):c.acept)+(c.favorito?4:0);
    for(let i=0;i<peso;i++)pool.push(c);
  });
  return pool[Math.floor(Math.random()*pool.length)];
}

function pistaPlatos(m,max){

}

function renderPlaylists(){
  const favoritos=biblioteca.filter(c=>c.favorito);
  let html='';

  // 1) Para inspirarte — las 4 playlists de MenuTwist en cuadrícula 2×2, nombre en el tono fuerte de su color
  html+=`<div class="pl-section-title">Para inspirarte</div>`;

  html+=`<div class="pl-grid">${MOODS.map(m=>`

      <svg class="pl-tile-icon" viewBox="0 0 24 24" style="stroke:var(--${m.tok}-d)">${m.icon}</svg>
      <b style="color:var(--${m.tok}-d)">${m.nombre}</b>
    </button>`).join('')}</div>`;

  // 2) Guardadas por vos — v128: leyenda (o las listas propias, máx. 4 + Ver todas) y al final la tarjeta de Favoritos
  html+=`<div class="pl-section-title">Guardadas por vos</div>`;
  const favHTML=`<button class="pl-row" style="border-left-color:var(--red)" onclick="previsualizarFavoritos()">
      <svg class="pl-row-icon ic-lleno" viewBox="0 0 24 24" style="stroke:var(--red);color:var(--red)"><path d="M12 20.5c-5-3.5-9-7-9-11A5 5 0 0 1 12 6.5 5 5 0 0 1 21 9.5c0 4-4 7.5-9 11z"/></svg>
      <div class="pl-row-txt">

        <div class="pl-row-sub">${favoritos.length?(favoritos.slice(0,3).map(c=>c.nombre).join(', ')+(favoritos.length>3?'…':'')):'Todavía no marcaste favoritos con el corazón.'}</div>
      </div>${CHEV_SVG}

  if(!LISTAS_GUARDADAS.length){

  }
  html+=favHTML;

function generarMenuFavoritos(favs){
  const usados=new Set();
  const nuevoMenu={};
  let catAnterior=null;
  DIAS_SEM.forEach(dia=>{
    nuevoMenu[dia]={m:null,n:null,gm:'',gn:''};
    ['m','n'].forEach(slot=>{
      const sinRepetirCat=favs.filter(c=>c.cat!==catAnterior);
      const pool=sinRepetirCat.length?sinRepetirCat:favs;
      const noUsados=pool.filter(c=>!usados.has(c.id));
      const cands=noUsados.length?noUsados:pool;
      const elegido=cands[Math.floor(Math.random()*cands.length)];
      if(elegido){
        nuevoMenu[dia][slot]=elegido.id;
        nuevoMenu[dia][slot==='m'?'gm':'gn']=elegido.guarni||'';
        usados.add(elegido.id);
        catAnterior=elegido.cat;
      }
    });
  });
  return nuevoMenu;
}

  aplicarMenuYEntrar(generarMenuFavoritos(favs));

function renderMeals(){
  let lista=catActiva==='Todos'?biblioteca:biblioteca.filter(c=>c.cat===catActiva);
  const q=normTxt(buscarCartaTxt.trim());
  const matchFn=c=>
    normTxt(c.nombre).includes(q) ||
    normTxt(c.guarni).includes(q) ||
    normTxt(c.cat).includes(q) ||
    (INGS[c.id]||[]).some(i=>normTxt(i).includes(q));

  let hintHTML='';
  if(q){
    lista=lista.filter(matchFn);
    if(catActiva!=='Todos'){
      const totalGeneral=biblioteca.filter(matchFn).length;
      if(totalGeneral>lista.length){
        hintHTML=`<div class="search-scope-hint">Buscando dentro de <b>${catActiva}</b> · <button onclick="setCat('Todos')">ver en todas (${totalGeneral})</button></div>`;
      }
    }
  }

  if(filtrosCarta.freezer) lista=lista.filter(c=>c.freezer);
  if(filtrosCarta.lunchera) lista=lista.filter(c=>c.lunchera);
  if(filtrosCarta.favorito) lista=lista.filter(c=>c.favorito);

  if(!lista.length){
    const algoActivo = q || filtrosCarta.freezer || filtrosCarta.lunchera || filtrosCarta.favorito;
    $('meals-list').innerHTML=hintHTML+`<div class="meals-empty">${algoActivo?`No hay comidas que cumplan con lo que estás buscando.`:'No hay comidas en esta categoría todavía.'}</div>`;
    return;
  }

  if(catActiva==='Pastas' && !q){
    const porSub={};
    lista.forEach(c=>{ const s=c.subcat||'Otras'; (porSub[s]=porSub[s]||[]).push(c); });
    const orden=['Simples','Rellenas','Otras'].filter(s=>porSub[s]&&porSub[s].length);
    $('meals-list').innerHTML=hintHTML+orden.map(s=>`
      <div class="cat-section-title">${s}</div>
      ${ordenarPorNombre(porSub[s]).map(mealItemHTML).join('')}
    `).join('');
    return;
  }

  $('meals-list').innerHTML=hintHTML+ordenarPorNombre(lista).map(mealItemHTML).join('');
}

function elegirDesdeCarta(id){
  const c=getC(id);
  if(pendingSlot){
    const{dia,slot}=pendingSlot;

  $('sheet-title').textContent=`¿Dónde ponemos ${c.nombre}?`;
  const vacios=[],ocupados=[];
  [...DIAS_SEM,...(findeMostrado?DIAS_FIN:[])].forEach(d=>{

      if(!menu[d][slot])vacios.push({d,slot,label});

  const opcionHTML=(o,reemplazo)=>`

      <div style="flex:1;text-align:left">
        <div style="font-size:14px;font-weight:600">${o.d}</div>
        <div style="font-size:12px;color:${reemplazo?'var(--amber-d)':'var(--green-d)'}">${o.label}${reemplazo?` · reemplaza "${o.actual?o.actual.nombre:''}"`:' · libre'}</div>

      ${vacios.length?`<div style="padding:0 4px 2px;font-size:11px;font-weight:700;color:var(--green-d);text-transform:uppercase;letter-spacing:.03em">Casilleros libres</div>`:''}

      ${ocupados.length?`<div style="padding:${vacios.length?'10px':'0'} 4px 2px;font-size:11px;font-weight:700;color:var(--amber-d);text-transform:uppercase;letter-spacing:.03em">Reemplazar</div>`:''}
      ${ocupados.map(o=>opcionHTML(o,true)).join('')}
      <button class="sheet-back" onclick="closeSheet({target:$('sheet')})">Cancelar</button>
    </div>`;
  $('sheet').classList.add('open');
}

function confirmarEdicion(id){
  const c=getC(id);if(!c)return;
  const n=$('ed-nombre')?.value?.trim();if(!n)return;
  const ingsTxt=$('ed-ings')?.value?.trim()||'';
  const guardarAhora=()=>{
    c.nombre=capFirst(n);
    c.guarni=capFirst($('ed-guarni')?.value?.trim()||'');
    c.cat=$('ed-cat')?.value||c.cat;
    c.t=parseInt($('ed-t')?.value||c.t);
    c.restr=[];
    c.acept=valorAcept('ed-acept');

    editandoComida=null;

function confirmarEliminarComida(id){
  [...DIAS_SEM,...DIAS_FIN].forEach(d=>['m','n'].forEach(s=>{if(menu[d][s]===id){menu[d][s]=null;menu[d][s==='m'?'gm':'gn']='';}}) );

  if(editandoComida===id)editandoComida=null;
  closeSheet({target:$('sheet')});
  renderCatTabs();renderMeals();renderPrincipal();
  guardar();

function generarComprasObjetos(){
  const set=new Set();
  [...DIAS_SEM,...DIAS_FIN].forEach(d=>['m','n'].forEach(s=>{
    const id=menu[d][s];if(!id)return;
    getIngsCasilleroParaComprar(d,s).forEach(i=>{if(i!=='Delivery')set.add(i);});
  }));
  const base=[...set].filter(i=>!stockExcluidos.includes(i)).map(texto=>({texto,tachado:!!stockTachado[texto],origen:'base',key:texto,cantidad:stockCantidades['base:'+texto]||''}));
  const extra=stockExtra.map(e=>({texto:e.texto,tachado:!!e.tachado,origen:'extra',key:e.id,cantidad:stockCantidades['extra:'+e.id]||''}));
  return [...base,...extra].sort((a,b)=>a.texto.localeCompare(b.texto,'es',{sensitivity:'base'}));
}

function renderStockUnica(){
  const lista=generarComprasObjetos();
  if(!lista.length && !editandoStockItem){
    const hayComidas=diasActivos().some(d=>menu[d].m||menu[d].n);
    $('stock-wrap').innerHTML=`<div class="stock-card"><div class="stock-empty">${hayComidas?'Las comidas de esta semana no suman ingredientes (por ejemplo, Delivery o platos sin ingredientes cargados). Si necesitás algo, agregalo a mano.':'Armá tu menú en Semana para generar la lista de compras.'}</div></div>
      <div class="stock-add-row"><input class="input" id="stock-nuevo-input" placeholder="Agregar algo a mano..." onkeydown="if(event.key==='Enter')agregarStockExtra()"><button class="btn-add-top" onclick="agregarStockExtra()">+ Agregar</button></div>`;
    return;
  }
  const pend=lista.filter(i=>!i.tachado);
  const tengo=lista.filter(i=>i.tachado);

  const itemRow=(it)=>{
    const editing = editandoStockItem && editandoStockItem.origen===it.origen && editandoStockItem.key===it.key;
    if(editing){
      return `<div class="stock-item editing">
        <input class="input stock-edit-input" id="stock-edit-input" value="${it.texto.replace(/"/g,'&quot;')}" onkeydown="if(event.key==='Enter')guardarEdicionStock('${it.origen}','${it.key.replace(/'/g,"\\'")}');if(event.key==='Escape')cancelarEdicionStock()">
        <button class="stock-edit-ok" onclick="guardarEdicionStock('${it.origen}','${it.key.replace(/'/g,"\\'")}')" aria-label="Guardar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
      </div>`;
    }
    return `<div class="stock-item${it.tachado?' done':''}">
      <input type="checkbox" ${it.tachado?'checked':''} onchange="toggleStockItem('${it.origen}','${it.key.replace(/'/g,"\\'")}')">
      <label onclick="toggleStockItem('${it.origen}','${it.key.replace(/'/g,"\\'")}')">${it.texto}</label>

    ${tengo.length?`<div class="stock-sec">Ya lo tengo en casa</div>${tengo.map(itemRow).join('')}`:``}

function setCantidadStock(origen,key,val){
  const k=origen+':'+key;
  if(val)stockCantidades[k]=val; else delete stockCantidades[k];
  guardar();
}

function toggleStockItem(origen,key){
  if(origen==='extra'){
    const e=stockExtra.find(x=>x.id===key);if(e)e.tachado=!e.tachado;
  }else{
    stockTachado[key]=!stockTachado[key];
  }
  renderStock();guardar();
}

function editarStockItem(origen,key){
  editandoStockItem={origen,key};
  renderStock();
}
function cancelarEdicionStock(){
  editandoStockItem=null;
  renderStock();
}
function guardarEdicionStock(origen,key){
  const val=$('stock-edit-input')?.value?.trim();
  editandoStockItem=null;
  if(!val){renderStock();return;}
  if(origen==='extra'){
    const e=stockExtra.find(x=>x.id===key);if(e)e.texto=capFirst(val);
  }else{
    const eraTachado=!!stockTachado[key];
    if(!stockExcluidos.includes(key))stockExcluidos.push(key);
    delete stockTachado[key];
    stockExtra.push({id:'se'+Date.now(),texto:capFirst(val),tachado:eraTachado,origen:'edicion'});
  }
  renderStock();guardar();
}

function agregarStockExtra(){
  const inp=$('stock-nuevo-input');
  const val=inp?.value?.trim();
  if(!val)return;
  stockExtra.push({id:'se'+Date.now(),texto:capFirst(val),tachado:false,origen:'manual'});
  renderStock();guardar();
}

function resetStock(){
  stockTachado={};
  stockExtra=[];
  stockExcluidos=[];
  stockCantidades={};
  renderStock();guardar();
  const m=$('done-msg');if(m){m.style.display='block';setTimeout(()=>m.style.display='none',2500);}
}

function seccionDeCompra(texto){
  const t=normTxt(texto);
  const carniceria=['carne','pollo','cerdo','bife','lomo','colita','entraña','entrana','milanesa','pechuga','supremas','chorizo','panceta','bondiola','picada','pescado','merluza','salmon','langostino','gamba','rabas','filet','pate'];
  const verduleria=['papa','cebolla','tomate','lechuga','zanahoria','zapallo','calabaza','choclo','morron','ajo','perejil','acelga','espinaca','brocoli','coliflor','palta','limon','repollo','rucula','remolacha','verdura','albahaca','puerro','batata'];
  if(carniceria.some(k=>t.includes(k)))return 'Carnicería';
  if(verduleria.some(k=>t.includes(k)))return 'Verdulería';
  return 'Súper';
}

async function compartirCompras(){
  const lista=generarComprasObjetos().filter(i=>!i.tachado);
  if(!lista.length){toast('No hay nada pendiente para compartir');return;}
  const secciones={'Verdulería':[],'Carnicería':[],'Súper':[]};
  lista.forEach(i=>secciones[seccionDeCompra(i.texto)].push(i.cantidad?`${i.texto} — ${i.cantidad}`:i.texto));
  let texto='🛒 Lista de compras — MenuTwist\n';
  ['Verdulería','Carnicería','Súper'].forEach(s=>{
    if(!secciones[s].length)return;
    texto+=`\n*${s}*\n`+secciones[s].map(t=>`• ${t}`).join('\n')+'\n';
  });
  if(navigator.share){
    try{ await navigator.share({title:'Lista de compras',text:texto}); return; }
    catch(e){ if(e?.name==='AbortError')return; }
  }
  abrirOpcionesCompartir(texto);
}
const LS_MENU = 'menutwist_menu';
